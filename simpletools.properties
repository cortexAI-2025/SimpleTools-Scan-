# ──────────────────────────────────────────────────────────────────────────────
# SimpleTools App Factory — product configuration (schema v1)
#
# This is the single file a derived SimpleTools app edits to define its
# identity. It is read by build-logic (AppFactoryConfig) at build time and
# validated: an invalid value fails the build with an explicit message.
# See docs/APP_FACTORY.md for every key.
# ──────────────────────────────────────────────────────────────────────────────
config.schemaVersion=1

# Identity
app.name=SimpleTools Scan
app.applicationId=com.simpletools.scan
app.versionCode=1
app.versionName=1.0.0

# Branding: blue | teal | green | orange | red | purple
branding.accent=orange

# Languages: English is always the default; only en and fr are supported for now.
languages.default=en
languages.supported=en,fr

# Shared features
features.onboarding=false

# Monetization — both off: no ads/billing SDK is shipped. See docs/MONETIZATION.md.
monetization.ads=false
monetization.premium=false

# Privacy
privacy.localOnly=true
privacy.analytics=false
# Public privacy policy URL (required by Google Play before release). Empty = hidden in About.
privacy.policyUrl=

# Android permissions this product declares in app/src/main/AndroidManifest.xml.
# Comma separated, e.g. android.permission.CAMERA. The build verifies that the merged
# manifest requests exactly these permissions — nothing more, nothing less.
permissions.declared=android.permission.CAMERA
