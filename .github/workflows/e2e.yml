name: E2E

# The V1 journey on an Android emulator, in airplane mode: camera capture, crop, rotation,
# reorder, PDF export checked page by page, camera refusal, resume after the app is killed,
# cancelled and failed exports. Screenshots, the PDF and its rendered pages are uploaded.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  emulator:
    name: Emulator (API 34), airplane mode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: ./scripts/run-e2e.sh build/e2e

      - name: Summary
        if: always()
        run: |
          echo "### End-to-end (emulator, airplane mode)" >> "$GITHUB_STEP_SUMMARY"
          cat build/e2e/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
          cat build/e2e/device.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload screenshots, PDF and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scan-e2e-results
          path: build/e2e/
          retention-days: 14
